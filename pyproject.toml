[project]
name = "lubriflow-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1", "python-multipart>=0.0.20",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1", "cryptography>=44", "boto3>=1.37",
  "authlib>=1.7,<2", "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E9", "F"]
